[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vfx-transcode"
dynamic = ["version"]
description = "Convert OpenEXR and other image sequences to review movies with oiiotool, OCIO and ffmpeg."
requires-python = ">=3.9"
dependencies = []   # standard library only; oiiotool and ffmpeg are external executables

[project.optional-dependencies]
tuner = ["PySide6"]                      # the tuner and process apps: uv sync --extra tuner

[dependency-groups]
dev = ["pytest", "pyinstaller>=5.9"]     # installed by uv sync by default

[project.scripts]
vfx-transcode = "vfx_transcode.cli:main"

[project.gui-scripts]
vfx-transcode-tuner = "vfx_tuner.app:main"
vfx-transcode-process = "vfx_process.app:main"

[tool.setuptools]
packages = ["vfx_transcode", "vfx_tuner", "vfx_process"]

[tool.setuptools.dynamic]
version = { attr = "vfx_transcode.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
